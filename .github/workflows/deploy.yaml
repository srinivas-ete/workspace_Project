name: Deploy Knowledge Base

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'

  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: deploy-kb
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

env:
  NODE_VERSION: 20.18.1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Disable pagefind binary download
        run: echo "PAGEFIND_SKIP_DOWNLOAD=true" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint:all

      - name: Run scripts
        run: |
          shopt -s nullglob
          for file in script/*.js; do
            node "$file"
          done

      - name: Run URL checker
        env:
          URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT }}
        run: node script/url-checker.js --timeout "$URL_CHECKER_TIMEOUT"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Disable pagefind binary download
        run: echo "PAGEFIND_SKIP_DOWNLOAD=true" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          PATH_PREFIX: "/${{ github.event.repository.name }}/"
        run: npm run eleventy:prod

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write
      issues: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Deploy Pages
        uses: actions/deploy-pages@v4

      - name: Create deployment issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then STATUS="succeeded"; else STATUS="failed"; fi
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          gh issue create --title "$DATE Deployment: $STATUS" --body "URL: $URL"
